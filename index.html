<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>follow up &amp; schedule</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, "Apple SD Gothic Neo", sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #1d1d1f;
  }
  @keyframes calShimmer { 0% { opacity: .6; } 50% { opacity: 1; } 100% { opacity: .6; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var h = React.createElement;

  // ---- 카테고리 색상 ----
  var CAT = {
    '해외여행': '#4A90D9',
    '워케이션': '#5BB98C',
    '휴가': '#C2569C',
    '출장': '#6B7C93',
    '행사': '#E8A04B'
  };

  // The server reads only the followup and Schedule sections from Notion.
  function loadContent() {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 15000);
    return fetch('/api/notion', { cache: 'no-store', signal: controller.signal })
      .then(function (r) {
        if (!r.ok) {
          if (r.status === 503) throw new Error('Notion 연결 설정이 필요합니다.');
          throw new Error('내용을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.');
        }
        return r.json();
      })
      .then(function (j) {
        if (!Array.isArray(j.followup) || !Array.isArray(j.events)) {
          throw new Error('내용을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.');
        }
        var events = j.events.map(function (it) {
          return {
            start: toDate(it.start), end: toDate(it.end || it.start),
            cat: String(it.category || ''), place: String(it.place || ''),
            memo: String(it.memo || '')
          };
        }).filter(function (it) { return it.start && it.end && it.end >= it.start; });
        return { followup: j.followup, events: events, warnings: j.warnings || [] };
      })
      .finally(function () { clearTimeout(timer); });
  }
  function toDate(str) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || '');
    if (!m) return null;
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    return d.getFullYear() === +m[1] && d.getMonth() === +m[2] - 1 && d.getDate() === +m[3] ? d : null;
  }
  function strip(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  function App() {
    var st = React.useState({ content: null, error: null });
    var state = st[0], setState = st[1];

    React.useEffect(function () {
      var active = true;
      loadContent()
        .then(function (content) { if (active) setState({ content: content, error: null }); })
        .catch(function (err) {
          if (active) setState({ content: null, error: err.name === 'AbortError'
            ? '불러오는 데 시간이 걸립니다. 잠시 후 새로고침해 주세요.' : err.message });
        });
      return function () { active = false; };
    }, []);

    var rng = monthRange();
    var first = rng[0], last = rng[rng.length - 1];
    var subtitle = first.year + '년 ' + (first.month + 1) + '월 – '
      + (first.year === last.year ? '' : last.year + '년 ') + (last.month + 1) + '월';
    var gridCols = 'repeat(auto-fit,minmax(min(100%,340px),1fr))';
    var headingStyle = { margin: 0, fontSize: '32px', fontWeight: 600, letterSpacing: '-0.5px', lineHeight: 1.2 };
    var mutedStyle = { color: 'rgba(0,0,0,0.5)', fontSize: '15px', lineHeight: 1.6 };
    var content = state.content;
    var followup = content
      ? (content.followup.length
        ? h('ul', { style: { margin: '20px 0 0', paddingLeft: '24px', fontSize: '17px', lineHeight: 1.8, overflowWrap: 'anywhere' } },
            content.followup.map(function (item, i) {
              return h('li', { key: i, style: { paddingLeft: '4px', whiteSpace: 'pre-wrap' } }, item);
            }))
        : h('p', { style: mutedStyle }, '등록된 항목이 없습니다.'))
      : (state.error ? null : h('p', { role: 'status', style: mutedStyle }, '불러오는 중…'));

    return h('main', { style: { minHeight: '100vh', padding: '48px 0 64px' } },
      h('div', { style: { maxWidth: '1280px', margin: '0 auto', padding: '0 clamp(20px,4vw,40px)' } },
        h('section', { 'aria-labelledby': 'followup-title', style: { marginBottom: '48px' } },
          h('h1', { id: 'followup-title', style: headingStyle }, 'follow up'),
          followup,
          state.error ? h('p', { role: 'alert', style: { fontSize: '15px', lineHeight: 1.6, color: '#b13e36' } }, state.error) : null
        ),
        h('section', { 'aria-labelledby': 'schedule-title' },
          h('div', { style: { display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: '20px', flexWrap: 'wrap', marginBottom: '24px' } },
            h('div', null,
              h('h2', { id: 'schedule-title', style: headingStyle }, 'schedule'),
              h('div', { style: { fontSize: '16px', color: 'rgba(0,0,0,0.5)', marginTop: '8px' } }, subtitle)
            ),
            h('div', { style: { display: 'flex', gap: '16px', alignItems: 'center', flexWrap: 'wrap' } },
              legend('#4A90D9', '해외여행'), legend('#5BB98C', '워케이션'),
              legend('#C2569C', '휴가'), legend('#6B7C93', '출장'), legend('#E8A04B', '행사·기념일')
            )
          ),
          content ? buildCalendar(content.events, gridCols, true)
            : (state.error ? h('p', { style: mutedStyle }, '일정을 표시하려면 연결을 확인한 뒤 새로고침해 주세요.') : skeleton(gridCols)),
          content && content.warnings.length
            ? h('p', { role: 'status', style: { marginTop: '20px', fontSize: '14px', color: '#966318', lineHeight: 1.6 } },
                content.warnings.join(' '))
            : null
        )
      )
    );
  }

  function legend(color, label) {
    return h('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
      h('span', { style: { width: '11px', height: '11px', borderRadius: '3px', background: color, display: 'inline-block' } }),
      h('span', { style: { fontSize: '13px', letterSpacing: '-0.2px', color: 'rgba(0,0,0,0.7)' } }, label)
    );
  }

  // 이번 달부터 3개월(연도 경계 자동 처리)
  function monthRange() {
    var now = new Date();
    var baseY = now.getFullYear(), baseM = now.getMonth();
    var list = [];
    for (var k = 0; k < 3; k++) {
      var mm = baseM + k;
      list.push({ year: baseY + Math.floor(mm / 12), month: ((mm % 12) + 12) % 12 });
    }
    return list;
  }

  function buildCalendar(events, gridCols, weekend) {
    var cards = monthRange().map(function (ym) { return monthCard(ym.year, ym.month, events, weekend); });
    return h('div', { style: { display: 'grid', gridTemplateColumns: gridCols, gap: '20px' } }, cards);
  }

  function monthCard(year, month, events, weekend) {
    var MN = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    var EN = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    var WD = ['일','월','화','수','목','금','토'];
    var wdColor = function (i) { return weekend && i === 0 ? '#e0584f' : weekend && i === 6 ? '#4A90D9' : 'rgba(0,0,0,0.4)'; };

    var first = new Date(year, month, 1);
    var startWeekday = first.getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var weeksCount = Math.ceil((startWeekday + daysInMonth) / 7);

    var weeks = [];
    for (var w = 0; w < weeksCount; w++) {
      var cells = [];
      for (var i = 0; i < 7; i++) {
        var dn = w * 7 + i - startWeekday + 1;
        cells.push((dn >= 1 && dn <= daysInMonth) ? dn : null);
      }
      var segs = [];
      for (var ei = 0; ei < events.length; ei++) {
        var ev = events[ei];
        var cs = null, ce = null;
        for (var col = 0; col < 7; col++) {
          var dnn = w * 7 + col - startWeekday + 1;
          if (dnn < 1 || dnn > daysInMonth) continue;
          var cur = new Date(year, month, dnn);
          if (cur >= strip(ev.start) && cur <= strip(ev.end)) {
            if (cs === null) cs = col;
            ce = col;
          }
        }
        if (cs !== null) {
          var startDn = w * 7 + cs - startWeekday + 1;
          var isStart = new Date(year, month, startDn).getTime() === strip(ev.start).getTime();
          segs.push({ ev: ev, cs: cs, ce: ce, isStart: isStart });
        }
      }
      segs.sort(function (a, b) { return a.cs - b.cs || (b.ce - b.cs) - (a.ce - a.cs); });
      var lanes = [];
      for (var si = 0; si < segs.length; si++) {
        var s = segs[si];
        var placed = false;
        for (var l = 0; l < lanes.length; l++) {
          if (lanes[l] < s.cs) { s.lane = l; lanes[l] = s.ce; placed = true; break; }
        }
        if (!placed) { s.lane = lanes.length; lanes.push(s.ce); }
      }
      weeks.push({ cells: cells, segs: segs, laneCount: lanes.length });
    }
    var maxLanes = Math.max.apply(null, [1].concat(weeks.map(function (x) { return x.laneCount; })));

    var header = h('div', { key: 'hd', style: { display: 'flex', alignItems: 'baseline', gap: '8px', marginBottom: '12px' } },
      h('span', { style: { fontSize: '19px', fontWeight: 600, color: '#1d1d1f', letterSpacing: '-0.3px' } }, MN[month]),
      h('span', { style: { fontSize: '11px', fontWeight: 600, color: 'rgba(0,0,0,0.3)', letterSpacing: '0.5px' } }, year + ' · ' + EN[month])
    );

    var wdRow = h('div', { key: 'wdrow', style: { display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', marginBottom: '6px' } },
      WD.map(function (d, i) { return h('div', { key: 'wd' + i, style: { textAlign: 'center', fontSize: '11px', fontWeight: 600, color: wdColor(i) } }, d); })
    );

    var weekEls = weeks.map(function (wk, wi) {
      var numCells = wk.cells.map(function (d, col) {
        var color = '#1d1d1f';
        if (d === null) color = 'transparent';
        else if (weekend && col === 0) color = '#e0584f';
        else if (weekend && col === 6) color = '#4A90D9';
        return h('div', { key: 'n' + col, style: { gridColumn: (col + 1) + '/' + (col + 2), gridRow: '1', textAlign: 'center', fontSize: '12px', color: color, lineHeight: '20px' } }, d ? String(d) : '');
      });
      var barEls = wk.segs.map(function (s, si) {
        var color = CAT[s.ev.cat] || '#9CA3AF';
        var isEvent = s.ev.cat === '행사';
        var label = isEvent ? s.ev.place : (s.ev.memo ? s.ev.place + ' · ' + s.ev.memo : s.ev.place);
        var titleTxt = s.ev.place + (s.ev.memo ? ' · ' + s.ev.memo : '');
        return h('div', { key: 'b' + si, title: titleTxt, style: { gridColumn: (s.cs + 1) + '/' + (s.ce + 2), gridRow: String(s.lane + 2), background: color, color: '#fff', fontSize: '11px', fontWeight: 600, borderRadius: '5px', padding: '0 6px', margin: '0 2px', height: '17px', lineHeight: '17px', overflow: 'hidden', whiteSpace: 'nowrap', textOverflow: 'ellipsis' } }, s.isStart ? label : '');
      });
      return h('div', { key: 'w' + wi, style: { display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gridTemplateRows: '20px repeat(' + maxLanes + ',19px)', rowGap: '2px', marginBottom: '3px' } }, numCells.concat(barEls));
    });

    return h('div', { key: 'm' + year + '-' + month, style: { background: '#fff', borderRadius: '16px', padding: '16px 16px 12px', boxShadow: 'rgba(0,0,0,0.04) 0px 4px 16px' } },
      [header, wdRow].concat(weekEls));
  }

  function skeleton(gridCols) {
    var cards = [];
    for (var i = 0; i < 3; i++) {
      cards.push(h('div', { key: i, style: { background: '#fff', borderRadius: '16px', padding: '16px', boxShadow: 'rgba(0,0,0,0.04) 0px 4px 16px', animation: 'calShimmer 1.4s ease-in-out infinite' } },
        h('div', { style: { width: '48px', height: '18px', borderRadius: '6px', background: '#ececef', marginBottom: '16px' } }),
        h('div', { style: { height: '190px', borderRadius: '8px', background: '#f3f3f5' } })
      ));
    }
    return h('div', { style: { display: 'grid', gridTemplateColumns: gridCols, gap: '20px' } }, cards);
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
</body>
</html>
